<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري - Firebase Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #25D366;
            --fb-color: #1877F2;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .admin-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        #adminPanel {
            display: none;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            border-right: 5px solid #333;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .submit-btn { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background-color: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; text-align: center; padding: 15px; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        .product-title { font-size: 1.2rem; margin: 10px 0; }
        .product-price { font-size: 1.1rem; color: #d9534f; font-weight: bold; margin-bottom: 15px; }
        .whatsapp-btn { background-color: var(--primary-color); color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; display: inline-block; }
        footer { margin-top: 40px; text-align: center; padding: 20px; background: #fff; border-radius: 8px; }
        .facebook-btn { background-color: var(--fb-color); color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <h1>متجري الإلكتروني</h1>
        <button class="admin-btn" onclick="toggleAdmin()">الإدارة ⚙️</button>
    </header>

    <section id="adminPanel">
        <h2>لوحة إضافة منتج جديد (سحابي)</h2>
        <form id="addProductForm" onsubmit="handleAddProduct(event)">
            <div class="form-group">
                <label for="pTitle">اسم المنتج:</label>
                <input type="text" id="pTitle" required>
            </div>
            <div class="form-group">
                <label for="pPrice">السعر (بالجنية):</label>
                <input type="number" id="pPrice" required>
            </div>
            <div class="form-group">
                <label for="pImage">رابط صورة المنتج (URL):</label>
                <input type="url" id="pImage" required>
            </div>
            <button type="submit" class="submit-btn">حفظ المنتج في السحابة</button>
        </form>
    </section>

    <main class="product-grid" id="productGrid">
        <p style="text-align: center; grid-column: 1/-1;">جاري تحميل المنتجات من السحابة...</p>
    </main>

    <footer>
        <p>تواصل معنا:</p>
        <a href="https://facebook.com/YOUR_PAGE_LINK" target="_blank" class="facebook-btn">صفحتنا على الفيسبوك</a>
    </footer>

    <!-- سكربتات فايربيز للـ CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // بيانات الربط الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyDGdiCLkrqDXc06qKuUpmIvZwFRr3DDgm0",
          authDomain: "new-project-81723.firebaseapp.com",
          databaseURL: "https://new-project-81723-default-rtdb.firebaseio.com",
          projectId: "new-project-81723",
          storageBucket: "new-project-81723.firebasestorage.app",
          messagingSenderId: "683773987909",
          appId: "1:683773987909:web:abf199e2858771fd4aa72c",
          measurementId: "G-NHLTYM1R3T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const whatsappNumber = "201000000000"; // استبدل برقمك الفعلي
        let isAdminLoggedIn = false;

        async function fetchProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                grid.innerHTML = '';
                
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">لا توجد منتجات حالياً. أضف منتجات من لوحة الإدارة.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const message = encodeURIComponent(`مرحباً، أود طلب المنتج الآتي:\n- الاسم: ${p.title}\n- السعر: ${p.price} جنيه`);
                    const waLink = `https://wa.me/${whatsappNumber}?text=${message}`;
                    
                    const cardHTML = `
                        <div class="product-card">
                            <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/250?text=لا+توجد+صورة'">
                            <h3 class="product-title">${p.title}</h3>
                            <div class="product-price">${p.price} ج.م</div>
                            <a href="${waLink}" target="_blank" class="whatsapp-btn">إكمال الطلب عبر الواتساب</a>
                        </div>
                    `;
                    grid.innerHTML += cardHTML;
                });
            } catch (error) {
                console.error("خطأ في جلب المنتجات: ", error);
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: red;">حدث خطأ أثناء تحميل المنتجات.</p>';
            }
        }

        window.toggleAdmin = function() {
            const panel = document.getElementById('adminPanel');
            if (isAdminLoggedIn) {
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                return;
            }
            const inputPass = prompt("برجاء إدخال كلمة مرور الإدارة:");
            if (inputPass === "1234") {
                isAdminLoggedIn = true;
                panel.style.display = 'block';
                alert("تم تسجيل الدخول بنجاح.");
            } else if (inputPass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        window.handleAddProduct = async function(event) {
            event.preventDefault();
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const image = document.getElementById('pImage').value;

            try {
                await addDoc(collection(db, "products"), {
                    title: title,
                    price: price,
                    image: image,
                    createdAt: new Date()
                });
                document.getElementById('addProductForm').reset();
                alert("تمت إضافة المنتج إلى السحابة بنجاح!");
                fetchProducts();
            } catch (error) {
                console.error("خطأ في الإضافة: ", error);
                alert("حدث خطأ أثناء حفظ المنتج.");
            }
        }

        // تحميل المنتجات عند فتح الصفحة
        fetchProducts();
    </script>
</body>
              </html>
